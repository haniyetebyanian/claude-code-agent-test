services:
  database:
    image: postgres:16-alpine
    container_name: agent-test-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_test
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  node-backend:
    image: node:22-alpine
    container_name: agent-test-backend
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sh", "-lc", "cd backend && npm run dev"]
    volumes:
      - ./:/workspace
    ports:
      - "8001:8000"
    depends_on:
      database:
        condition: service_healthy

  node-frontend:
    image: node:22-alpine
    container_name: agent-test-frontend
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sh", "-lc", "cd frontend && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ./:/workspace
    ports:
      - "5173:5173"

volumes:
  postgres_data:

